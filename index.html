<!doctype html><html lang="no"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#080b12"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><title>Stuekontroll</title><link rel="manifest" href="/manifest.webmanifest"/><link rel="stylesheet" href="/style.css"/></head><body><main class="app"><header><div><p class="eyebrow">HJEM • STUE</p><h1>Stuekontroll</h1></div><span id="status" class="status">Ikke koblet</span></header><nav><button class="tab active" data-tab="tv">TV</button><button class="tab" data-tab="lys">Lys</button><button class="tab" data-tab="setup">Oppsett</button></nav><section id="tv" class="panel active"><div class="toprow"><button class="key danger" data-cmd="power">⏻<small>POWER</small></button><button class="key" data-cmd="source">▣<small>SOURCE</small></button><button class="key" data-cmd="settings">⚙<small>INNST.</small></button></div><div class="remote"><div class="dpad"><button class="up" data-cmd="up">▲</button><button class="left" data-cmd="left">◀</button><button class="ok" data-cmd="ok">OK</button><button class="right" data-cmd="right">▶</button><button class="down" data-cmd="down">▼</button></div><div class="twocol"><button class="wide" data-cmd="back">↶ <span>Tilbake</span></button><button class="wide" data-cmd="exit">✕ <span>Exit</span></button></div><div class="media"><button data-cmd="volume_down">−<small>VOL</small></button><button data-cmd="mute">⌁<small>MUTE</small></button><button data-cmd="volume_up">+<small>VOL</small></button></div></div></section><section id="lys" class="panel"><div class="hero"><span>✦</span><div><h2>Telys</h2><p>Stemning i stuen</p></div></div><div class="lights"><button data-script="telys_on_alle">☀<b>Alle på</b></button><button data-script="telys_off_alle">◐<b>Alle av</b></button><button data-script="telys_flame">♨<b>Flamme</b></button><button data-script="telys_static">✦<b>Statisk</b></button></div></section><section id="setup" class="panel"><div class="card"><h2>Koble til Home Assistant</h2><p>Appen lagrer opplysningene bare på denne enheten. Bruk en Long-Lived Access Token.</p><label>Home Assistant-adresse<input id="haUrl" placeholder="https://xxxx.ui.nabu.casa"/></label><label>Access token<textarea id="token" rows="4" placeholder="Lim inn token"></textarea></label><label>RM4 remote entity<input id="entity" placeholder="remote.wi_fi_universal_remote"/></label><button id="save" class="save">Lagre og test</button><p id="setupMsg" class="msg"></p></div></section><footer><span>RM4 MINI</span><i></i><span>HOME ASSISTANT</span></footer></main><div id="toast"></div><script src="/app.js"></script></body></html>
